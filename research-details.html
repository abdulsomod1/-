  <script>document.addEventListener('DOMContentLoaded', () => { const item = researches.find(r => r.id === Number(new URLSearchParams(location.search).get('id'))); const root = document.querySelector('[data-research-detail]'); if (!item) { root.innerHTML = '<div class="empty-state"><span class="empty-icon">?</span><h1>البحث غير موجود</h1><a class="button button-primary" href="research.html">العودة إلى مكتبة البحوث</a></div>'; return; } root.innerHTML = `<div class="detail-grid"><div class="detail-cover"><img src="${item.cover}" alt="غلاف تجريبي: ${item.title}" onerror="this.hidden=true;this.parentElement.classList.add('cover-missing')"><span class="demo-ribbon">محتوى تجريبي</span></div><div class="detail-copy"><span class="eyebrow">${item.category}</span><h1>${item.title}</h1><p class="english-title">${item.titleEnglish}</p><div class="detail-meta"><div><span>الباحث</span><strong>${item.author}</strong><small>${item.authorEnglish}</small></div><div><span>إشراف</span><strong>${item.supervisor}</strong></div><div><span>السنة</span><strong>${item.hijriYear} / ${item.gregorianYear}</strong></div><div><span>التاريخ</span><strong>${item.date}</strong></div></div><div class="detail-actions"><button class="button button-primary" data-read>قراءة البحث</button><button class="button button-ghost" data-share>مشاركة البحث</button></div><p class="pdf-note">سيتم إضافة ملف البحث PDF هنا · ${item.pdf ? 'الملف متوفر' : 'PDF غير متوفر حالياً'}</p></div></div><div class="abstract"><span class="eyebrow">عن السجل</span><h2>الملخص</h2><p>${item.description}</p><div class="notice">هذا النص وبيانات الغلاف والنشر تجريبية، إلى حين إدراج المعلومات المعتمدة.</div></div>`; document.querySelector('[data-share]').addEventListener('click', async () => { try { if (navigator.share) await navigator.share({ title: item.title, url: location.href }); else { await navigator.clipboard.writeText(location.href); alert('تم نسخ الرابط'); } } catch (e) { } }); document.querySelector('[data-read]').addEventListener('click', () => alert('سيتم إضافة ملف البحث PDF هنا')); });</script>
